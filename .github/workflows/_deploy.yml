name: _deploy
on:
  workflow_call:
    inputs:
      source_tag: { required: true, type: string }
      target_tag: { required: true, type: string }
      health_url: { required: true, type: string }
      registry: { required: true, type: string }
      registry_username: { required: true, type: string }
      # Commit de la imagen que se despliega. El readiness compara contra este
      # valor, nunca contra `github.sha` a secas.
      expected_sha: { required: true, type: string }
      # Titulo del deploy en Dokploy. Sin esto el panel muestra "NEW CHANGES".
      commit_message: { required: false, type: string, default: '' }
    secrets:
      registry_password: { required: true }
      deploy_webhook: { required: true }

jobs:
  # Se queda en ubuntu-latest a proposito: tiene el webhook de produccion.
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validar configuración
        env:
          HEALTH_URL: ${{ inputs.health_url }}
          REGISTRY_USERNAME: ${{ inputs.registry_username }}
          WEBHOOK: ${{ secrets.deploy_webhook }}
        run: |
          case "$HEALTH_URL" in
            http://*/api/health|https://*/api/health) ;;
            *) echo "::error::La variable DOKPLOY_HEALTH_URL debe ser una URL HTTP(S) completa terminada en /api/health"; exit 1 ;;
          esac
          if [ -z "$REGISTRY_USERNAME" ]; then
            echo "::error::Falta la variable de repo REGISTRY_USERNAME"; exit 1
          fi
          if [ -z "$WEBHOOK" ]; then
            echo "::error::Falta el secret DOKPLOY_DEPLOY_WEBHOOK"; exit 1
          fi

      - name: Login al registry (retry)
        env:
          REGISTRY_USERNAME: ${{ inputs.registry_username }}
          REGISTRY_PASSWORD: ${{ secrets.registry_password }}
        run: |
          for i in $(seq 1 8); do
            printf '%s' "$REGISTRY_PASSWORD" | docker login "${{ inputs.registry }}" -u "$REGISTRY_USERNAME" --password-stdin && exit 0
            wait=$(( i * 10 ))
            echo "login intento $i fallo; reintento en ${wait}s..."; sleep "$wait"
          done
          echo "::error::login al registry fallo tras 8 intentos"; exit 1

      # Retag en el registry, sin pull ni push de capas: `:main` pasa a apuntar
      # exactamente a la imagen construida para este commit.
      - name: Promover tag (retry)
        run: |
          for i in $(seq 1 4); do
            docker buildx imagetools create -t "${{ inputs.target_tag }}" "${{ inputs.source_tag }}" && exit 0
            wait=$(( i * 15 ))
            echo "retag intento $i fallo; reintento en ${wait}s..."; sleep "$wait"
          done
          echo "::error::retag fallo tras 4 intentos"; exit 1

      - name: Trigger Dokploy (retry)
        env:
          WEBHOOK: ${{ secrets.deploy_webhook }}
          DEPLOY_SHA: ${{ inputs.expected_sha }}
          # toJSON escapa comillas y saltos de linea del mensaje: no hay que
          # sanearlo a mano ni depender de jq para armar el cuerpo.
          COMMIT_MSG_JSON: ${{ toJSON(inputs.commit_message) }}
        run: |
          # Dokploy titula el deploy con lo que venga en el webhook. Con el
          # formato de push de GitHub toma el mensaje del commit como titulo y
          # el hash como descripcion; un POST vacio queda como "NEW CHANGES".
          mensaje="$COMMIT_MSG_JSON"
          if [ -z "$mensaje" ] || [ "$mensaje" = '""' ] || [ "$mensaje" = 'null' ]; then
            mensaje="\"Deploy $DEPLOY_SHA\""
          fi
          payload="{\"head_commit\":{\"id\":\"$DEPLOY_SHA\",\"message\":$mensaje}}"

          for i in $(seq 1 4); do
            curl -fsS -X POST "$WEBHOOK" \
              -H 'Content-Type: application/json' \
              -H 'x-github-event: push' \
              -d "$payload" && exit 0
            echo "webhook intento $i fallo; reintento en 12s..."; sleep 12
          done
          echo "::error::webhook de Dokploy fallo tras 4 intentos"; exit 1

      - name: Esperar readiness
        env:
          HEALTH_URL: ${{ inputs.health_url }}
          ESPERADO: ${{ inputs.expected_sha }}
        run: |
          # No alcanza con que la app responda sano: el contenedor viejo tambien
          # responde "ok", y Dokploy rota el contenedor de forma asincrona
          # despues del webhook. Se espera hasta que /api/health informe el
          # commit que se acaba de desplegar.
          #
          # A diferencia de Ecokit no hay tolerancia para un health sin commit:
          # este pipeline nace con GIT_SHA en la imagen, asi que un sha vacio
          # es una imagen mal construida, no una version vieja.
          INTENTOS=90
          ultimo=""
          ultimo_storage=""
          for i in $(seq 1 "$INTENTOS"); do
            respuesta=$(curl -fsS --max-time 10 "$HEALTH_URL" || true)
            case "$respuesta" in
              *'"status":"ok"'*)
                # Sin jq a proposito: si faltara o fallara, el commit quedaria
                # vacio y la comparacion podria dar verde sin comprobar nada.
                actual=$(printf '%s' "$respuesta" | sed -n 's/.*"sha"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')
                if [ -n "$actual" ] && [ "$actual" = "$ESPERADO" ]; then
                  # `storage` (ok|error) avisa que RustFS o los buckets fallan sin tumbar la
                  # web: el deploy queda rojo para que se note. Si el campo falta (imagen
                  # vieja en un rollback) no se exige.
                  storage=$(printf '%s' "$respuesta" | sed -n 's/.*"storage"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')
                  if [ -n "$storage" ] && [ "$storage" != "ok" ]; then
                    # Puede ser un error pasajero (cliente en frio, RustFS arrancando): no se
                    # corta al primero, se sigue esperando y recien al final queda en rojo.
                    ultimo_storage=$storage
                    echo "la app corre en $ESPERADO pero el storage informa '$storage' ($i/$INTENTOS)"
                    sleep 5
                    continue
                  fi
                  echo "healthy en $ESPERADO (intento $i)"; exit 0
                fi
                ultimo=${actual:-sin-commit}
                echo "sano pero todavia responde $ultimo ($i/$INTENTOS)"
                ;;
              *) echo "esperando health... ($i/$INTENTOS)" ;;
            esac
            sleep 5
          done
          if [ -n "$ultimo_storage" ]; then
            echo "::error::la app llego a responder $ESPERADO pero el storage siguio informando '$ultimo_storage' (las subidas de archivos no funcionan)"
            exit 1
          fi
          echo "::error::el contenedor no llego a responder $ESPERADO en 7,5 minutos (ultimo visto: ${ultimo:-ninguno})"
          exit 1

      # Prueba de humo: la pantalla de ingreso responde. No usa credenciales ni toca datos; el
      # health ya probo base y storage, esto prueba que Next renderiza paginas.
      - name: Prueba de humo
        env:
          HEALTH_URL: ${{ inputs.health_url }}
        run: |
          base="${HEALTH_URL%/api/health}"
          for i in $(seq 1 6); do
            codigo=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$base/login" || true)
            if [ "$codigo" = "200" ]; then echo "login responde 200"; exit 0; fi
            echo "login respondio '$codigo' ($i/6)"; sleep 10
          done
          echo "::error::la pantalla de ingreso no responde 200 tras el deploy; considerar rollback (workflow rollback)"
          exit 1
