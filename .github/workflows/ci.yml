name: CI
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
# Un push nuevo cancela el run anterior de la misma rama: el E2E tarda ~20 minutos y no tiene sentido terminarlo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  types-and-lint:
    # Variable de repo `CI_RUNNER`; vacia = runner de GitHub. Con un label `blacksmith-*` corre en Blacksmith
    # (requiere instalar su GitHub App en la organizacion: sin ella el job queda en cola para siempre).
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
      - run: npm run check-types
        env:
          # tsc del proyecto completo pasa los ~2 GB del heap por defecto de Node (OOM, exit 134).
          NODE_OPTIONS: --max-old-space-size=8192
      - run: npm test

  db-tests:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    needs: types-and-lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # scripts/seed-company.ts se ejecuta con `node` en modo nativo TS
          # (sin ts-node/tsx); requiere Node >=22.18/23.6. El Dockerfile usa node:24.
          node-version: 24
          cache: npm
      - name: Preparar .env.docker
        # .env.docker.example trae los puertos default (POSTGRES_PORT=5432 etc.);
        # el runner no tiene nada escuchando ahi, asi que no hace falta remapear.
        run: |
          cp .env.docker.example .env.docker
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=devpass/' .env.docker
          sed -i 's/^S3_SECRET_KEY=.*/S3_SECRET_KEY=devpassdevpass/' .env.docker
          sed -i 's/^JOBS_TOKEN=.*/JOBS_TOKEN=devtoken/' .env.docker
      - run: docker compose --env-file .env.docker build postgres
      - run: npm ci
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
      - run: bash scripts/test-db.sh
      # Los tests de auth estan gateados por DATABASE_URL, asi que `npm test` no los corre:
      # sin esto, una regresion en `input: false` —la propiedad que sostiene todo el perimetro
      # multi-empresa— no la agarra nadie. El job ya tiene Postgres levantado.
      - run: bash scripts/test-auth.sh

      # Integracion de los jobs de P5: usa la base de trabajo `alphataco` (test-db.sh usa
      # `alphataco_test`), aplica migraciones y crea/borra sus propios datos.
      - run: bash scripts/test-jobs.sh
      - run: bash scripts/test-warehouses.sh
      - run: bash scripts/test-purchases.sh
      - run: bash scripts/test-treasury.sh

  # E2E de la instancia completa (imagen de produccion + RustFS real + Playwright). Ver `_e2e.yml`.
  e2e:
    needs: types-and-lint
    uses: ./.github/workflows/_e2e.yml
    with:
      runs_on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}

  # Mismo e2e con la app conectada como `alphataco_app` (sin BYPASSRLS) y TENANT_CONTEXT=on. Informativo por ahora.
  e2e-rls:
    needs: types-and-lint
    uses: ./.github/workflows/_e2e.yml
    with:
      runs_on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
      rls: true
