name: alphataco

# Build args comunes de la imagen Next (NEXT_PUBLIC_* quedan embebidas en el bundle).
x-next-build-args: &next-build-args
  NEXT_PUBLIC_PROJECT_URL: ${NEXT_PUBLIC_PROJECT_URL}
  NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL}
  NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY}
  NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST}
  NEXT_PUBLIC_SHOW_LOGS: ${NEXT_PUBLIC_SHOW_LOGS:-false}

services:
  postgres:
    build: ./docker/postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: alphataco
      POSTGRES_USER: alphataco
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: America/Argentina/Buenos_Aires
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./prisma/tests:/tests:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alphataco -d alphataco"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [alphataco]

  # Almacenamiento de objetos S3-compatible: RustFS (reemplaza a MinIO, cuya imagen oficial ya no se puede bajar de Docker
  # Hub). Los buckets NO los crea el compose: los crea `scripts/ensure-buckets.ts` desde `STORAGE_BUCKETS` (el entrypoint
  # de la app en produccion y `scripts/dev-up.sh` en desarrollo), asi hay una sola lista. RustFS corre como usuario no root.
  storage:
    image: ${STORAGE_IMAGE:-rustfs/rustfs:1.0.3@sha256:9ca9559533b537d10482fe923288b676ad08f92a7069d9a17327fbae3cab688b}
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
    volumes:
      - storage-data:/data
    ports:
      # STORAGE_PORT / STORAGE_CONSOLE_PORT; se aceptan los MINIO_PORT / MINIO_CONSOLE_PORT de un .env.docker viejo.
      - "127.0.0.1:${STORAGE_PORT:-${MINIO_PORT:-9000}}:9000"
      - "127.0.0.1:${STORAGE_CONSOLE_PORT:-${MINIO_CONSOLE_PORT:-9001}}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [alphataco]

  # Aplica las migraciones de Prisma (0_init + pendientes) antes de que arranque `app`.
  # Usa la stage `build` del Dockerfile (node_modules completo + prisma.config.ts):
  # el CLI de Prisma 7 no puede correr desde el output standalone de Next.
  migrate:
    build:
      context: .
      target: build
      args: *next-build-args
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://alphataco:${POSTGRES_PASSWORD}@postgres:5432/alphataco
    depends_on:
      postgres:
        condition: service_healthy
    networks: [alphataco]
    restart: "no"

  app:
    build:
      context: .
      args: *next-build-args
    restart: unless-stopped
    env_file: .env.docker
    environment:
      DATABASE_URL: postgresql://alphataco:${POSTGRES_PASSWORD}@postgres:5432/alphataco
      DIRECT_URL: postgresql://alphataco:${POSTGRES_PASSWORD}@postgres:5432/alphataco
      # El almacenamiento solo es alcanzable desde la red del compose: el navegador nunca le habla,
      # todos los archivos salen por /api/files de la app.
      S3_ENDPOINT: http://storage:9000
    depends_on:
      postgres:
        condition: service_healthy
      storage:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/login').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [alphataco]

  # API móvil (`/api/mobile/v1`): la MISMA imagen que `app`, en un proceso aparte (ráfagas de reintentos al volver la
  # señal y exportaciones pesadas no deben tirar la web). Detrás del perfil `mobile`: sin él no existe y Caddy manda
  # todo a `app`, que responde 404 a /api/mobile/*. Con el perfil: `COMPOSE_PROFILES=mobile MOBILE_UPSTREAM=api:3000`.
  # No pasa por el entrypoint (migraciones, buckets y seed son de `app`/`migrate`): arranca Next directo.
  api:
    profiles: [mobile]
    build:
      context: .
      args: *next-build-args
    restart: unless-stopped
    command: ["node", "server.js"]
    env_file: .env.docker
    environment:
      DATABASE_URL: postgresql://alphataco:${POSTGRES_PASSWORD}@postgres:5432/alphataco
      DIRECT_URL: postgresql://alphataco:${POSTGRES_PASSWORD}@postgres:5432/alphataco
      S3_ENDPOINT: http://storage:9000
      MOBILE_API_ENABLED: "true"
    depends_on:
      app:
        condition: service_healthy
    networks: [alphataco]

  cron:
    build: ./docker/cron
    restart: unless-stopped
    environment:
      JOBS_TOKEN: ${JOBS_TOKEN}
      APP_URL: http://app:3000
      TZ: America/Argentina/Buenos_Aires
    depends_on:
      app:
        condition: service_healthy
    networks: [alphataco]

  # SMTP de prueba para verificar los correos de los jobs de punta a punta (P5). NO arranca
  # con `up`: vive detrás del perfil `mail`, así que hay que pedirlo explícitamente
  # (`docker compose --env-file .env.docker --profile mail up -d mailpit`). Captura todo lo
  # que se le manda y no reenvía nada a internet. Ver la sección "Jobs" de
  # docs/desarrollo/entornos.md. No usar en producción.
  mailpit:
    image: axllent/mailpit:latest
    profiles: [mail]
    restart: unless-stopped
    ports:
      # 1025 = SMTP, 8025 = interfaz web y API REST (`/api/v1/messages`).
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_WEB_PORT:-8025}:8025"
    networks: [alphataco]

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      # Sin el perfil `mobile` la API móvil cae en `app` (que responde 404); con él se exporta MOBILE_UPSTREAM=api:3000.
      MOBILE_UPSTREAM: ${MOBILE_UPSTREAM:-app:3000}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      app:
        condition: service_healthy
    networks: [alphataco]

volumes:
  pgdata:
  storage-data:
  caddy-data:

networks:
  alphataco:
