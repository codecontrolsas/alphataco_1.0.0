name: alphataco

# Build args comunes de la imagen Next (NEXT_PUBLIC_* quedan embebidas en el bundle).
x-next-build-args: &next-build-args
  NEXT_PUBLIC_PROJECT_URL: ${NEXT_PUBLIC_PROJECT_URL}
  NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL}
  NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY}
  NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST}
  NEXT_PUBLIC_SHOW_LOGS: ${NEXT_PUBLIC_SHOW_LOGS:-false}

services:
  postgres:
    build: ./docker/postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: alphataco
      POSTGRES_USER: alphataco
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: America/Argentina/Buenos_Aires
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./prisma/tests:/tests:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alphataco -d alphataco"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [alphataco]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [alphataco]

  minio-init:
    image: minio/mc:latest
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$$S3_ACCESS_KEY\" \"$$S3_SECRET_KEY\" &&
      for b in document-files document-files-expired contract-documents daily-reports logo avatar clothing-signatures repair-images tire-discards preparte-img invoice-pdfs supplier-documents customer-documents; do mc mb -p local/$$b; mc anonymous set none local/$$b; done"
    networks: [alphataco]

  # Aplica las migraciones de Prisma (0_init + pendientes) antes de que arranque `app`.
  # Usa la stage `build` del Dockerfile (node_modules completo + prisma.config.ts):
  # el CLI de Prisma 7 no puede correr desde el output standalone de Next.
  migrate:
    build:
      context: .
      target: build
      args: *next-build-args
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://alphataco:${POSTGRES_PASSWORD}@postgres:5432/alphataco
    depends_on:
      postgres:
        condition: service_healthy
    networks: [alphataco]
    restart: "no"

  app:
    build:
      context: .
      args: *next-build-args
    restart: unless-stopped
    env_file: .env.docker
    environment:
      DATABASE_URL: postgresql://alphataco:${POSTGRES_PASSWORD}@postgres:5432/alphataco
      DIRECT_URL: postgresql://alphataco:${POSTGRES_PASSWORD}@postgres:5432/alphataco
      # MinIO solo es alcanzable desde la red del compose: el navegador nunca le habla,
      # todos los archivos salen por /api/files de la app.
      S3_ENDPOINT: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/login').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [alphataco]

  cron:
    build: ./docker/cron
    restart: unless-stopped
    environment:
      JOBS_TOKEN: ${JOBS_TOKEN}
      APP_URL: http://app:3000
      TZ: America/Argentina/Buenos_Aires
    depends_on:
      app:
        condition: service_healthy
    networks: [alphataco]

  # SMTP de prueba para verificar los correos de los jobs de punta a punta (P5). NO arranca
  # con `up`: vive detrás del perfil `mail`, así que hay que pedirlo explícitamente
  # (`docker compose --env-file .env.docker --profile mail up -d mailpit`). Captura todo lo
  # que se le manda y no reenvía nada a internet. Ver la sección "Jobs" de
  # docs/desarrollo/entornos.md. No usar en producción.
  mailpit:
    image: axllent/mailpit:latest
    profiles: [mail]
    restart: unless-stopped
    ports:
      # 1025 = SMTP, 8025 = interfaz web y API REST (`/api/v1/messages`).
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_WEB_PORT:-8025}:8025"
    networks: [alphataco]

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      app:
        condition: service_healthy
    networks: [alphataco]

volumes:
  pgdata:
  minio-data:
  caddy-data:

networks:
  alphataco:
